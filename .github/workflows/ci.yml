name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test task and --tests selectors to run instead of the full build'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        java: [ 8, 11, 17, 18 ]
    name: Test JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          java-package: 'jdk'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Test result logging
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/test-count.gradle <<'INIT'
          allprojects {
              tasks.withType(Test).configureEach {
                  afterTest { desc, result ->
                      if (result.resultType == TestResult.ResultType.SKIPPED) {
                          println("SKIPPED TEST: ${desc.className} > ${desc.name}")
                      } else if (result.resultType == TestResult.ResultType.FAILURE) {
                          println("FAILED TEST: ${desc.className} > ${desc.name}")
                      }
                  }
                  afterSuite { desc, result ->
                      if (desc.parent == null) {
                          println("TEST SUMMARY [${project.path}:${name}]: ${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped")
                      }
                  }
              }
          }
          INIT
      - name: Build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: ${{ inputs.test-filter != '' && format('assemble jar {0}', inputs.test-filter) || 'build jar -x checkstyleMain -x checkstyleTest -x checkstyleRegressionTest' }}
      - name: Jacoco
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jacocoTestReport
      - uses: actions/upload-artifact@v4
        if: matrix.java == '8'
        with:
          name: junrar-jar
          path: |
            build/libs/junrar-*.jar
            !build/libs/junrar-*-sources.jar
            !build/libs/junrar-*-javadoc.jar
          if-no-files-found: error

  release:
    name: semantic release
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    if: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v2
        with:
          node-version: '16'
          cache: 'npm'
      - uses: actions/setup-java@v2
        with:
          java-version: '8'
          java-package: 'jdk'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.MAVENCENTRAL_USER }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.MAVENCENTRAL_PASSWORD }}
        run: npx semantic-release
